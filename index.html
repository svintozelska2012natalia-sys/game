<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Roblox: Tower of Hell (Dogs Edition)</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body, html { width: 100%; height: 100%; overflow: hidden; background: #0f172a; color: #fff; }
    #app { position: relative; width: 100vw; height: 100vh; display: flex; justify-content: center; align-items: center; }
    
    /* Screen Views */
    .view { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: none; flex-direction: column; justify-content: center; align-items: center; z-index: 10; background: rgba(15, 23, 42, 0.95); }
    .view.active { display: flex; }

    /* Modal Cards */
    .card { background: #1e293b; border: 3px solid #38bdf8; border-radius: 20px; padding: 25px; width: 90%; max-width: 480px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    h1 { color: #38bdf8; margin-bottom: 15px; font-size: 26px; }
    h2 { color: #f43f5e; margin-bottom: 10px; }
    p { margin-bottom: 15px; color: #94a3b8; font-size: 14px; }
    
    input[type="text"] { width: 100%; padding: 12px 15px; border-radius: 10px; border: 2px solid #475569; background: #0f172a; color: #fff; font-size: 16px; margin-bottom: 15px; text-align: center; }
    input[type="text"]:focus { outline: none; border-color: #38bdf8; }

    /* Avatar Selection */
    .avatar-grid { display: flex; justify-content: space-around; gap: 10px; margin-bottom: 20px; }
    .avatar-card { background: #334155; border: 2px solid transparent; border-radius: 12px; padding: 10px; cursor: pointer; flex: 1; transition: 0.2s; }
    .avatar-card.selected { border-color: #38bdf8; background: #0284c7; }
    .avatar-card img, .avatar-icon { width: 50px; height: 50px; font-size: 40px; line-height: 50px; margin: 0 auto 5px; }

    /* Buttons */
    .btn { background: #0284c7; color: white; border: none; padding: 12px 25px; border-radius: 12px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.2s; box-shadow: 0 4px 0 #0369a1; }
    .btn:active { transform: translateY(4px); box-shadow: none; }
    .btn-success { background: #10b981; box-shadow: 0 4px 0 #059669; }
    .btn-danger { background: #ef4444; box-shadow: 0 4px 0 #dc2626; }

    /* Server List */
    .server-item { display: flex; justify-content: space-between; align-items: center; background: #334155; padding: 10px 15px; border-radius: 10px; margin-bottom: 8px; }
    .friend-item { display: flex; justify-content: space-between; align-items: center; background: #1e293b; border: 1px solid #475569; padding: 8px 12px; border-radius: 8px; margin-bottom: 6px; }

    /* Game HUD */
    #hud { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 5; display: none; flex-direction: column; justify-content: space-between; padding: 15px; }
    .top-bar { display: flex; justify-content: space-between; align-items: center; width: 100%; }
    .badge { background: rgba(30, 41, 59, 0.85); border: 2px solid #38bdf8; padding: 8px 15px; border-radius: 20px; font-weight: bold; font-size: 14px; color: #fff; }
    
    /* Controls Overlay for Mobile */
    #touch-controls { position: absolute; bottom: 20px; left: 0; width: 100%; padding: 0 20px; display: flex; justify-content: space-between; align-items: flex-end; pointer-events: none; z-index: 6; }
    .dpad { pointer-events: auto; display: grid; grid-template-columns: repeat(3, 50px); grid-template-rows: repeat(2, 50px); gap: 5px; }
    .touch-btn { background: rgba(255, 255, 255, 0.25); border: 2px solid rgba(255, 255, 255, 0.5); border-radius: 15px; display: flex; justify-content: center; align-items: center; font-size: 20px; font-weight: bold; color: white; touch-action: manipulation; }
    .touch-btn:active { background: rgba(56, 189, 248, 0.6); }
    .btn-jump { pointer-events: auto; width: 80px; height: 80px; border-radius: 50%; background: rgba(16, 185, 129, 0.4); border: 3px solid #10b981; font-size: 16px; font-weight: bold; text-align: center; }

    /* Canvas */
    canvas { width: 100%; height: 100%; display: block; background: #0f172a; }
  </style>
</head>
<body>

  <div id="app">
    <!-- Registration / Login View -->
    <div id="view-auth" class="view active">
      <div class="card">
        <h1>Roblox Tower of Hell</h1>
        <p>Введіть ваш нікнейм та оберіть собачку:</p>
        <input type="text" id="username" placeholder="Ваш нікнейм" value="Гравець123" maxlength="15">
        
        <div class="avatar-grid">
          <div class="avatar-card selected" onclick="selectAvatar('phoebe', this)">
            <div class="avatar-icon">🐶</div>
            <div style="font-weight: bold; font-size: 12px; color: #fbbf24;">Собачка Фібі</div>
          </div>
          <div class="avatar-card" onclick="selectAvatar('blue', this)">
            <div class="avatar-icon">🦜</div>
            <div style="font-weight: bold; font-size: 12px; color: #38bdf8;">Собачка Блю</div>
          </div>
          <div class="avatar-card" onclick="selectAvatar('anya', this)">
            <div class="avatar-icon">👑</div>
            <div style="font-weight: bold; font-size: 12px; color: #f43f5e;">Аня Іщук</div>
          </div>
        </div>

        <button class="btn btn-success" style="width: 100%;" onclick="startApp()">Увійти у гру</button>
      </div>
    </div>

    <!-- Server & Friends View -->
    <div id="view-servers" class="view">
      <div class="card" style="max-width: 550px;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
          <h2 style="margin: 0;">Сервери та Друзі</h2>
          <span id="user-display" class="badge"></span>
        </div>

        <!-- Servers -->
        <div style="text-align: left; margin-bottom: 15px;">
          <h3 style="font-size: 14px; color: #94a3b8; margin-bottom: 8px;">Оберіть сервер для гри:</h3>
          <div class="server-item">
            <div><strong>Server #1: Classic Tower</strong><br><small style="color:#94a3b8;">Рівні 1-16 (Легкий)</small></div>
            <button class="btn" onclick="joinServer('Server #1')">Грати</button>
          </div>
          <div class="server-item">
            <div><strong>Server #2: Pro Obby Zone</strong><br><small style="color:#94a3b8;">Рівні 1-16 (Спідран)</small></div>
            <button class="btn" onclick="joinServer('Server #2')">Грати</button>
          </div>
        </div>

        <!-- Friends -->
        <div style="text-align: left;">
          <h3 style="font-size: 14px; color: #94a3b8; margin-bottom: 8px;">Список друзів:</h3>
          <div style="display: flex; gap: 8px; margin-bottom: 10px;">
            <input type="text" id="friend-name" placeholder="Ім'я друга" style="margin: 0; text-align: left;">
            <button class="btn btn-success" onclick="addFriend()">Додати</button>
          </div>
          <div id="friends-list" style="max-height: 120px; overflow-y: auto;">
            <!-- Friends items -->
          </div>
        </div>
      </div>
    </div>

    <!-- HUD -->
    <div id="hud">
      <div class="top-bar">
        <div class="badge" id="hud-level">Рівень: 1 / 16</div>
        <div class="badge" id="hud-coins" style="color: #fbbf24;">🪙 Монети: 0</div>
        <button class="btn btn-danger" style="pointer-events: auto; padding: 6px 12px; font-size: 12px;" onclick="leaveServer()">Вийти</button>
      </div>
    </div>

    <!-- Mobile Touch Controls -->
    <div id="touch-controls">
      <div class="dpad">
        <div></div>
        <div class="touch-btn" id="btn-up">▲</div>
        <div></div>
        <div class="touch-btn" id="btn-left">◄</div>
        <div class="touch-btn" id="btn-down">▼</div>
        <div class="touch-btn" id="btn-right">►</div>
      </div>
      <div class="touch-btn btn-jump" id="btn-jump">JUMP</div>
    </div>

    <!-- Main Game Canvas -->
    <canvas id="gameCanvas"></canvas>
  </div>

  <script>
    // App State
    let selectedAvatar = 'phoebe';
    let username = 'Гравець123';
    let currentServer = null;
    let friends = ['Макс_Собачка', 'Оля_Блю'];

    // Game Physics & Loop Variables
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    let animationId = null;

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // Player Object
    const player = {
      x: 100,
      y: 0,
      width: 40,
      height: 40,
      vx: 0,
      vy: 0,
      speed: 6,
      jumpForce: -13,
      gravity: 0.65,
      grounded: false,
      currentStage: 1,
      coins: 0,
      avatar: 'phoebe'
    };

    // Controls
    const keys = { left: false, right: false, up: false };

    // Platforms (16 Levels setup)
    let platforms = [];
    let trampolines = [];
    let coins = [];

    function generate16Stages() {
      platforms = [];
      trampolines = [];
      coins = [];

      let currentY = canvas.height - 80;

      // Base floor
      platforms.push({ x: 0, y: currentY, w: 2000, h: 40, stage: 1 });

      for (let i = 1; i <= 16; i++) {
        let stageY = currentY - (i * 120);

        // Platform per stage
        let w = Math.max(120, 250 - i * 5);
        let x = 100 + (i % 2 === 0 ? (i * 90) % 400 : 400 - (i * 90) % 400);

        platforms.push({ x: x, y: stageY, w: w, h: 20, stage: i });

        // Add trampoline to some stages
        if (i % 3 === 0) {
          trampolines.push({ x: x + w / 2 - 15, y: stageY - 10, w: 30, h: 10 });
        }

        // Add coin
        coins.push({ x: x + w / 2, y: stageY - 30, collected: false });
      }

      // Peak victory platform
      platforms.push({ x: 200, y: currentY - (17 * 120), w: 300, h: 30, isPeak: true });
    }

    // Avatar Selection
    function selectAvatar(type, el) {
      selectedAvatar = type;
      document.querySelectorAll('.avatar-card').forEach(c => c.classList.remove('selected'));
      el.classList.add('selected');
    }

    function startApp() {
      username = document.getElementById('username').value.trim() || 'Гравець';
      player.avatar = selectedAvatar;
      document.getElementById('user-display').innerText = `${username} (${getAvatarIcon(selectedAvatar)})`;

      document.getElementById('view-auth').classList.remove('active');
      document.getElementById('view-servers').classList.add('active');
      renderFriends();
    }

    function getAvatarIcon(type) {
      if (type === 'phoebe') return '🐶';
      if (type === 'blue') return '🦜';
      return '👑';
    }

    function renderFriends() {
      const container = document.getElementById('friends-list');
      container.innerHTML = '';
      friends.forEach(f => {
        const div = document.createElement('div');
        div.className = 'friend-item';
        div.innerHTML = `<span>🎮 ${f}</span><button class="btn" style="padding:4px 8px; font-size:12px;" onclick="joinServer('Server #1')">Join</button>`;
        container.appendChild(div);
      });
    }

    function addFriend() {
      const input = document.getElementById('friend-name');
      if (input.value.trim()) {
        friends.push(input.value.trim());
        input.value = '';
        renderFriends();
      }
    }

    function joinServer(serverName) {
      currentServer = serverName;
      document.getElementById('view-servers').classList.remove('active');
      document.getElementById('hud').style.display = 'flex';

      // Reset Player
      generate16Stages();
      player.x = 200;
      player.y = canvas.height - 140;
      player.vx = 0;
      player.vy = 0;
      player.currentStage = 1;

      // Start Game Loop
      if (!animationId) gameLoop();
    }

    function leaveServer() {
      document.getElementById('hud').style.display = 'none';
      document.getElementById('view-servers').classList.add('active');
    }

    // Key Listeners
    window.addEventListener('keydown', e => {
      if (e.key === 'a' || e.key === 'A' || e.key === 'ArrowLeft') keys.left = true;
      if (e.key === 'd' || e.key === 'D' || e.key === 'ArrowRight') keys.right = true;
      if (e.key === 'w' || e.key === 'W' || e.key === ' ' || e.key === 'ArrowUp') {
        if (!keys.up && player.grounded) {
          player.vy = player.jumpForce;
          player.grounded = false;
        }
        keys.up = true;
      }
    });

    window.addEventListener('keyup', e => {
      if (e.key === 'a' || e.key === 'A' || e.key === 'ArrowLeft') keys.left = false;
      if (e.key === 'd' || e.key === 'D' || e.key === 'ArrowRight') keys.right = false;
      if (e.key === 'w' || e.key === 'W' || e.key === ' ' || e.key === 'ArrowUp') keys.up = false;
    });

    // Touch Controls
    const bindTouch = (id, keyName) => {
      const el = document.getElementById(id);
      el.addEventListener('touchstart', (e) => {
        e.preventDefault();
        if (keyName === 'up' && player.grounded) {
          player.vy = player.jumpForce;
          player.grounded = false;
        }
        keys[keyName] = true;
      });
      el.addEventListener('touchend', (e) => {
        e.preventDefault();
        keys[keyName] = false;
      });
    };

    bindTouch('btn-left', 'left');
    bindTouch('btn-right', 'right');
    bindTouch('btn-up', 'up');
    bindTouch('btn-jump', 'up');

    // Main Game Loop
    function gameLoop() {
      // 1. Update Physics
      if (keys.left) player.vx = -player.speed;
      else if (keys.right) player.vx = player.speed;
      else player.vx = 0;

      player.vy += player.gravity;

      player.x += player.vx;
      player.y += player.vy;

      player.grounded = false;

      // Collision with Platforms
      platforms.forEach(p => {
        if (
          player.x < p.x + p.w &&
          player.x + player.width > p.x &&
          player.y + player.height >= p.y &&
          player.y + player.height <= p.y + 15 &&
          player.vy >= 0
        ) {
          player.grounded = true;
          player.vy = 0;
          player.y = p.y - player.height;
          if (p.stage) player.currentStage = Math.max(player.currentStage, p.stage);
        }
      });

      // Collision with Trampolines
      trampolines.forEach(t => {
        if (
          player.x < t.x + t.w &&
          player.x + player.width > t.x &&
          player.y + player.height >= t.y &&
          player.y + player.height <= t.y + 15 &&
          player.vy >= 0
        ) {
          player.vy = -18; // Super jump!
        }
      });

      // Coins Collection
      coins.forEach(c => {
        if (!c.collected && Math.hypot(player.x + 20 - c.x, player.y + 20 - c.y) < 25) {
          c.collected = true;
          player.coins += 10;
        }
      });

      // Screen Boundaries & Fall Reset
      if (player.x < 0) player.x = 0;
      if (player.x > canvas.width - player.width) player.x = canvas.width - player.width;

      if (player.y > canvas.height + 200) {
        // Respawn on ground
        player.x = 200;
        player.y = canvas.height - 140;
        player.vy = 0;
      }

      // Camera Offset
      let cameraY = canvas.height / 2 - player.y;

      // 2. Render Graphics
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      ctx.save();
      ctx.translate(0, cameraY);

      // Draw Platforms
      platforms.forEach(p => {
        ctx.fillStyle = p.isPeak ? '#fbbf24' : '#334155';
        ctx.fillRect(p.x, p.y, p.w, p.h);
        ctx.strokeStyle = '#38bdf8';
        ctx.strokeRect(p.x, p.y, p.w, p.h);

        if (p.stage) {
          ctx.fillStyle = '#94a3b8';
          ctx.font = '12px sans-serif';
          ctx.fillText(`Stage ${p.stage}`, p.x + 5, p.y - 5);
        }
      });

      // Draw Trampolines
      trampolines.forEach(t => {
        ctx.fillStyle = '#10b981';
        ctx.fillRect(t.x, t.y, t.w, t.h);
      });

      // Draw Coins
      coins.forEach(c => {
        if (!c.collected) {
          ctx.fillStyle = '#fbbf24';
          ctx.beginPath();
          ctx.arc(c.x, c.y, 8, 0, Math.PI * 2);
          ctx.fill();
        }
      });

      // Draw Player Character (Dog Mesh Style)
      ctx.fillStyle = selectedAvatar === 'phoebe' ? '#d97706' : (selectedAvatar === 'blue' ? '#0284c7' : '#ec4899');
      ctx.fillRect(player.x, player.y, player.width, player.height);

      // Dog Head details
      ctx.fillStyle = '#fff';
      ctx.font = '24px sans-serif';
      ctx.fillText(getAvatarIcon(selectedAvatar), player.x + 6, player.y - 5);

      // Player Name
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 12px sans-serif';
      ctx.fillText(username, player.x - 10, player.y - 30);

      ctx.restore();

      // Update HUD
      document.getElementById('hud-level').innerText = `Рівень: ${player.currentStage} / 16`;
      document.getElementById('hud-coins').innerText = `🪙 Монети: ${player.coins}`;

      animationId = requestAnimationFrame(gameLoop);
    }
  </script>
</body>
</html>
